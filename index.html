<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Store</title>
</head>
<body>
    <header>
        <h3>Cadastre seu veículo para vender mais rápido</h3>
    </header>
    <div>
        <div>
            <p>Formulário</p>
        </div>
        <div>
            <h1>Venda fácil seu carro</h1>
            <p>Descreva as características dos seu carro e marque os opicionais que ele possui</p>
            <form>
                <div>
                    <label for="title">Título do Anúncio <span>*</span></label>
                    <input type="text" name="tittle" id="tittle" placeholder="um título para anúnciar um carro">
                </div>
                <div>
                    <label for="preco">preço<span>*</span></label>
                    <input type="number" name="preco" id="preco" placeholder="defina preço">
                </div>
                 <label for="descricao">descrição <span>*</span></label>
                    <textarea name="descricao" id="descricao" placeholder="Faça a descrição de seu veículo"></textarea>
                </div>
                <div>

                    <label for="marca">marca <span>*</span></label>
                    <input type="text" name= "marca" id="marca" placeholder="Marca do veículo"></input>
                </div>
                <div>

                    <label for="modelo">Modelo <span>*</span></label>
                    <input type="text" name= "modelo" id="modelo" placeholder="Coloque o modelo de seu veículo"></input>
                </div>
                 <div>

                    <label for="quilometragem">Quilometragem <span>*</span></label>
                    <input type="number" name= "quilometragem" id="quilometragem" placeholder="Quilometragem do veículo"></input>
                </div>
                 <div>

                    <label for="data-de-compra">Data de compra <span>*</span></label>
                    <input type="date" name= "data-de-compra" id="data-de-compra"></input>
                </div>
                
            </form>
        </div>
    </div>
</body>
</html>
